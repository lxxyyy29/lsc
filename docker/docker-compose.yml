# ============================================
# 东莞杰瑞智慧网格治理平台 - Docker Compose 配置
#
# 部署注意事项：
# - 使用 9071/9072/9073/9074 空闲端口（HTTPS 另占 9075），避开已有服务
#   （已确认与 uav/emqx/wvp/gitlab/gov 等项目无冲突）
# - 数据库/Redis/MongoDB/MinIO 不映射宿主机端口，仅在 Docker 内部网络访问
# - 所有容器添加日志轮转，防止磁盘爆满
# - 容器名统一使用 changping- 前缀，避免与现有容器冲突
# - 数据目录由 .env 的 DATA_ROOT 控制（默认 /uav_data），与服务器上其他项目分离
#
# 安全建议：
# - 生产环境必须修改 .env 中所有默认密码
# - 数据库端口不对公网开放
# - 配置阿里云安全组限制来源 IP
# ============================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  # ==========================================
  # MySQL 数据库（不映射宿主机端口）
  # ==========================================
  dgjr-mysql:
    image: mysql:8.0
    container_name: dgjr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zhsq
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    # 不映射宿主机端口，仅在 Docker 网络内部访问
    expose:
      - "3306"
    volumes:
      - ${DATA_ROOT:-/uav_data}/data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # Redis 缓存（不映射宿主机端口）
  # ==========================================
  dgjr-redis:
    image: redis:7-alpine
    container_name: dgjr-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - ${DATA_ROOT:-/uav_data}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # MongoDB（告警数据，不映射宿主机端口）
  # ==========================================
  dgjr-mongodb:
    image: mongo:7
    container_name: dgjr-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: alarm_dgcp
      TZ: Asia/Shanghai
    expose:
      - "27017"
    volumes:
      - ${DATA_ROOT:-/uav_data}/data/mongodb:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # MinIO 对象存储（不映射宿主机端口）
  # ==========================================
  dgjr-minio:
    # Docker Hub 的 minio/minio 已不可拉取（pull access denied），改用 MinIO 官方 quay 仓库
    # （quay.io 上同时提供 amd64/arm64 manifest）
    image: quay.io/minio/minio:latest
    container_name: dgjr-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      TZ: Asia/Shanghai
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${DATA_ROOT:-/uav_data}/data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # 后端 API（映射 9072）
  # ==========================================
  dgjr-backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: dgjr-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库配置（使用容器名内部访问）
      DB_URL: jdbc:mysql://dgjr-mysql:3306/zhsq?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis 配置
      REDIS_HOST: dgjr-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0
      # MongoDB 配置
      MONGODB_HOST: dgjr-mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: alarm_dgcp
      # JWT 密钥（生产环境必须修改）
      JWT_SECRET: changping-grid-community-2026-secret-key
      # 文件上传
      MEDIA_UPLOAD_DIR: /app/uploads/
      MEDIA_ACCESS_URL: ${DOMAIN:-http://localhost:9071}/media/files/
      # MinIO/OSS 配置
      OSS_ENDPOINT: http://dgjr-minio:9000/
      OSS_ACCESS: ${OSS_ACCESS:-http://8.138.97.118:9071/minio/}
      OSS_ACCESS_KEY: ${MINIO_USER:-admin}
      OSS_SECRET_KEY: ${MINIO_PASSWORD:-Changping@2024!Minio}
      OSS_BUCKET: dgcp-oa
      # 阿里云短信（手机号验证码）
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      # 联调固定验证码：默认 123456，让没有短信资质/额度的环境也能走通小程序验证码登录；
      # 正式环境请在 .env 中设 SMS_TEST_CODE_ENABLED=false 关闭（不建议用置空方式，见 .env.example 说明）
      SMS_TEST_CODE_ENABLED: ${SMS_TEST_CODE_ENABLED:-true}
      SMS_TEST_CODE: ${SMS_TEST_CODE:-123456}
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-9072}:8080"
    volumes:
      - ${DATA_ROOT:-/uav_data}/uploads:/app/uploads
      # 固定摄像头 HLS 转流目录（宿主机 ffmpeg 输出，后端代理提供浏览器播放）
      - ${VIDEO_HLS_DIR:-/uav_data/video-hls}:/app/video-hls
    depends_on:
      dgjr-mysql:
        condition: service_healthy
      dgjr-redis:
        condition: service_healthy
      dgjr-mongodb:
        condition: service_healthy
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # Web 管理端（映射 9071，HTTPS 9075）
  # ==========================================
  dgjr-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: web
    container_name: dgjr-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9071}:80"
      - "${HTTPS_PORT:-9075}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - dgjr-backend
      - dgjr-h5
      - dgjr-mp
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # H5 移动端（映射 9073）
  # ==========================================
  dgjr-h5:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: h5
    container_name: dgjr-h5
    restart: unless-stopped
    ports:
      - "${H5_PORT:-9073}:80"
    depends_on:
      - dgjr-backend
    networks:
      - dgjr-net
    logging: *default-logging

  # ==========================================
  # 小程序（映射 9074）
  # ==========================================
  dgjr-mp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: mp
    container_name: dgjr-mp
    restart: unless-stopped
    ports:
      - "${MP_PORT:-9074}:80"
    depends_on:
      - dgjr-backend
    networks:
      - dgjr-net
    logging: *default-logging

# ==========================================
# 网络
# ==========================================
networks:
  dgjr-net:
    driver: bridge
    name: dgjr-net
