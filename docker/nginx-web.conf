# Web 管理端 Nginx 配置（80 为 HTTP 兼容入口，443 为 HTTPS 入口，由 compose 映射到 8443）
server {
    listen 80;
    listen 443 ssl;
    server_name drone.kfktec.cn _;

    # SSL 证书（卷挂载 ./ssl -> /etc/nginx/ssl）
    ssl_certificate /etc/nginx/ssl/drone.kfktec.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/drone.kfktec.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    root /usr/share/nginx/html;
    index index.html;

    # 全站 UTF-8 声明：避免无 charset 头时部分浏览器按本地编码解析导致中文乱码
    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由
    # index.html 不缓存：保证每次访问都拉取最新构建（JS/CSS 文件名带 hash，可长期缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api/ {
        proxy_pass http://changping-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket 代理（信息互通功能）
    location /ws/ {
        proxy_pass http://changping-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 媒体文件（后端 context-path 为 /api，需带上前缀）
    # 注：用 ^~ 确保优先于上方静态资源正则 location，否则 .png 等请求会被 SPA 规则拦截
    location ^~ /media/ {
        proxy_pass http://changping-backend:8080/api/media/;
        proxy_set_header Host $host;
    }

    # OSS 媒体代理（小程序 HTTPS 图片直链）
    # /dgcp_oa/ 兼容历史数据（2025minio 9009），/minio-proxy/ 兼容老 MinIO 直链，/minio/ 指向本项目 MinIO
    location ^~ /dgcp_oa/ {
        proxy_pass http://172.17.98.15:9009/dgcp-oa/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    location ^~ /minio-proxy/ {
        proxy_pass http://8.135.237.224:9001/;
        proxy_set_header Host 8.135.237.224:9001;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    location ^~ /minio/ {
        proxy_pass http://changping-minio:9000/dgcp-oa/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    # H5 移动端聚合入口（HTTPS 定位需要 https://域名 环境，三端统一从本入口访问）
    # 注：必须用 ^~，否则 .js/.css 请求会被上方静态资源正则 location 拦截导致 404
    location ^~ /h5/ {
        proxy_pass http://changping-h5:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 小程序（居民端）聚合入口，hash 路由天然支持子路径
    location ^~ /mp/ {
        proxy_pass http://changping-mp:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
