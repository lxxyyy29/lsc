# H5 移动端 Nginx 配置
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # H5 base 路径重写：/h5/assets/xxx -> /assets/xxx
    rewrite ^/h5/(.*)$ /$1 break;

    location /api/ {
        proxy_pass http://changping-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://changping-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://changping-backend:8080/media/;
    }

    # OSS 媒体代理（H5 相对路径图片：/dgcp_oa/xxx -> 历史 MinIO，/minio/xxx -> 本项目 MinIO）
    # 注：用 ^~ 确保优先于上方静态资源正则 location
    location ^~ /dgcp_oa/ {
        proxy_pass http://172.17.98.15:9009/dgcp-oa/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    location ^~ /minio-proxy/ {
        proxy_pass http://8.135.237.224:9001/;
        proxy_set_header Host 8.135.237.224:9001;
        add_header 'Access-Control-Allow-Origin' '*';
    }

    location ^~ /minio/ {
        proxy_pass http://changping-minio:9000/dgcp-oa/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header 'Access-Control-Allow-Origin' '*';
    }
}
